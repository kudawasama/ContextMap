[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-map"
version = "1.2.1"
description = "Mapa mental narrativo de proyectos para agentes de IA"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "kudawasama", email = "cespedes.jac@gmail.com"}
]
keywords = ["context", "obsidian", "ai", "agent", "mindmap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/kudawasama/ContextMap"
Repository = "https://github.com/kudawasama/ContextMap"
Issues = "https://github.com/kudawasama/ContextMap/issues"

[project.scripts]
ctxmap = "context_map.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["context_map"]

[tool.pytest.ini_options]
testpaths = ["context_map/__tests__"]
