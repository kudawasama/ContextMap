[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-map-generator"
version = "0.2.0"
description = "Mapa mental narrativo de proyectos en formato Obsidian, con contexto técnico y emocional para agentes de IA"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "kudawasama", email = "cespedes.jac@gmail.com" }
]
keywords = ["context", "obsidian", "ai-agent", "mind-map", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
ctxmap = "context_map.cli:main"

[project.urls]
Homepage = "https://github.com/kudawasama/context-map-generator"
Repository = "https://github.com/kudawasama/context-map-generator"
Issues = "https://github.com/kudawasama/context-map-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["context_map"]
