name: 'ContextMap AI Governance Action'
description: 'Mantiene vivo el contexto del proyecto, actualiza la bóveda Obsidian y audita el readiness para Agentes de IA'
author: 'kudawasama'

branding:
  icon: 'map'
  color: 'blue'

inputs:
  python-version:
    description: 'Versión de Python a utilizar'
    required: false
    default: '3.11'
  check-readiness:
    description: 'Falla el build si el score de readiness cae por debajo del umbral mínimo'
    required: false
    default: 'false'
  min-score:
    description: 'Puntaje mínimo de readiness (0-100)'
    required: false
    default: '80'
  export-format:
    description: 'Formato opcional de exportación (xml, json, markdown)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ContextMap
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install context-map || pip install -e .

    - name: Refresh ContextMap
      shell: bash
      run: |
        ctxmap refresh .

    - name: Check Readiness
      if: ${{ inputs.check-readiness == 'true' }}
      shell: bash
      run: |
        ctxmap check .

    - name: Export Context
      if: ${{ inputs.export-format != '' }}
      shell: bash
      run: |
        ctxmap export . --format ${{ inputs.export-format }}
