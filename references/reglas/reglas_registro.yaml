# Catálogo de reglas fijas del proyecto ContextMap (fuente única de verdad).
#
# Convención Gobernanza: este archivo vive en el REPO (versionado, con tests y
# auditor), no en el vault. `ctxmap scan`, `ctxmap build` y el brief lo leen para
# reflejar cada regla como nodo REGLA y resumirla en CONTEXT.md / CONTEXT.min.md.
#
# Para qué sirve: un agente que lee el brief sabe QUÉ está obligado a hacer en
# este proyecto, sin adivinar ni depender de la memoria del chat.
#
# Campos obligatorios por regla (los valida
# `context_map/__tests__/test_reglas_del_repo.py`):
#   id            REG-<CAT>-<NNN>, único, 3 letras de categoría
#   resumen       una línea (45 caracteres máx.), la que sale en el brief mínimo
#   nombre        la regla completa, en imperativo
#   categoria     el prefijo del id
#   prioridad     critica | alta | media
#   estado        implementada | pendiente
#   norma         archivo real del repo donde está escrita la regla
#   seccion       apartado concreto dentro de ese archivo
#   verificacion  doctor:<chequeo> | test:<archivo> | manual
#                 doctor: el chequeo debe existir en doctor.CHECKS
#                 test:   el archivo debe existir en context_map/__tests__
#                 manual: conducta, se audita a mano
#
# Nota: estas reglas NO se improvisan ni se editan desde el chat. Una regla
# nueva entra aquí con su `norma` ya escrita en el repo, o no entra.

